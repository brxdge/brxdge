<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1E1E1E"/>
      <stop offset="100%" stop-color="#0C0C0C"/>
    </linearGradient>
    <linearGradient id="cable" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#2A2A2A"/>
      <stop offset="25%"  stop-color="#D0D0D0"/>
      <stop offset="50%"  stop-color="#FFFFFF"/>
      <stop offset="75%"  stop-color="#D0D0D0"/>
      <stop offset="100%" stop-color="#2A2A2A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="80" fill="url(#bg)"/>
  <rect x="1" y="1" width="398" height="398" rx="79" fill="none" stroke="#2E2E2E" stroke-width="1.5"/>

  <!-- Suspension cable — elevated, thicker, bright chrome -->
  <path d="M 55 270 Q 200 155 345 270" fill="none" stroke="url(#cable)" stroke-width="5"/>

  <!-- Deck line -->
  <line x1="55" y1="270" x2="345" y2="270" stroke="#282828" stroke-width="2"/>

  <!-- Hangers — brighter, wider -->
  <line x1="90"  y1="250" x2="90"  y2="270" stroke="#787878" stroke-width="2"/>
  <line x1="122" y1="228" x2="122" y2="270" stroke="#848484" stroke-width="2"/>
  <line x1="157" y1="203" x2="157" y2="270" stroke="#909090" stroke-width="2"/>
  <line x1="200" y1="155" x2="200" y2="270" stroke="#A0A0A0" stroke-width="2"/>
  <line x1="243" y1="203" x2="243" y2="270" stroke="#909090" stroke-width="2"/>
  <line x1="278" y1="228" x2="278" y2="270" stroke="#848484" stroke-width="2"/>
  <line x1="310" y1="250" x2="310" y2="270" stroke="#787878" stroke-width="2"/>
</svg>
