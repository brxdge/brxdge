<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRXDGE Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #F4F5F7;
  --panel: #FFFFFF;
  --border: #E7E9EE;
  --text: #14161A;
  --muted: #6B7280;
  --sidebar: #14161A;
  --sidebar-text: #C7C9D1;
  --sidebar-active: #FFFFFF;
  --accent: #4F46E5;
  --accent-2: #7C3AED;
  --radius: 14px;
  --shadow: 0 2px 10px rgba(20,22,26,0.05), 0 1px 2px rgba(20,22,26,0.04);
}
*{ box-sizing:border-box; }
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
}
button{ font-family:inherit; cursor:pointer; }
input,textarea,select{ font-family:inherit; }
a{ color:inherit; }

/* ---------- LOGIN SCREEN ---------- */
#loginScreen{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg,#14161A 0%,#1F2937 100%);
  padding:20px;
}
.login-card{
  width:100%; max-width:380px; background:var(--panel); border-radius:20px;
  padding:36px 32px; box-shadow:0 30px 70px rgba(0,0,0,0.35);
}
.login-card .brand{ font-weight:800; font-size:20px; letter-spacing:-0.02em; margin-bottom:6px; }
.login-card .sub{ color:var(--muted); font-size:14px; margin-bottom:28px; }
.field{ margin-bottom:16px; }
.field label{ display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:6px; }
.field input, .field textarea, .field select{
  width:100%; padding:11px 13px; border:1.5px solid var(--border); border-radius:10px;
  font-size:14.5px; color:var(--text); background:#fff; outline:none;
  transition:border-color 0.15s ease;
}
.field input:focus, .field textarea:focus, .field select:focus{ border-color:var(--accent); }
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:11px 18px; border-radius:10px; border:none; font-weight:600; font-size:14px;
  transition:transform 0.15s ease, opacity 0.15s ease;
}
.btn:active{ transform:scale(0.98); }
.btn:disabled{ opacity:0.55; cursor:not-allowed; }
.btn-primary{ background:var(--accent); color:#fff; width:100%; }
.btn-primary:hover{ opacity:0.92; }
.btn-ghost{ background:var(--border); color:var(--text); }
.btn-ghost:hover{ background:#dcdfe6; }
.btn-danger{ background:#FEE2E2; color:#B91C1C; }
.btn-danger:hover{ background:#FECACA; }
.login-error{ color:#DC2626; font-size:13px; margin-top:10px; display:none; }
.login-error.show{ display:block; }

/* ---------- DASHBOARD SHELL ---------- */
#dashboard{ display:none; min-height:100vh; }
#dashboard.show{ display:flex; }

.sidebar{
  width:240px; flex-shrink:0; background:var(--sidebar); color:var(--sidebar-text);
  display:flex; flex-direction:column; padding:26px 16px; position:fixed; top:0; bottom:0; left:0;
}
.sidebar .brand{
  color:#fff; font-weight:800; font-size:18px; letter-spacing:-0.02em;
  padding:0 10px 26px; display:flex; align-items:center; gap:8px;
}
.sidebar nav{ display:flex; flex-direction:column; gap:2px; flex:1; }
.sidebar .nav-item{
  display:flex; align-items:center; gap:11px; padding:11px 12px; border-radius:10px;
  font-size:14px; font-weight:500; background:none; border:none; color:var(--sidebar-text);
  text-align:left; width:100%; transition:background 0.15s ease, color 0.15s ease;
}
.sidebar .nav-item svg{ flex-shrink:0; opacity:0.75; }
.sidebar .nav-item:hover{ background:rgba(255,255,255,0.06); color:#fff; }
.sidebar .nav-item.active{ background:rgba(255,255,255,0.1); color:#fff; }
.sidebar .nav-item.active svg{ opacity:1; }
.sidebar .nav-badge{
  margin-left:auto; background:#EF4444; color:#fff; font-size:11px; font-weight:700;
  padding:1px 7px; border-radius:20px; min-width:18px; text-align:center;
}
.sidebar-foot{ border-top:1px solid rgba(255,255,255,0.1); padding-top:14px; margin-top:14px; }
.sidebar-foot .whoami{ font-size:12.5px; color:#9CA3AF; padding:0 12px 10px; }
.sidebar-foot .whoami b{ color:#fff; }

.main{ flex:1; margin-left:240px; padding:32px 40px 80px; max-width:1400px; }
.page-title{ font-size:26px; font-weight:800; letter-spacing:-0.01em; margin:0 0 4px; }
.page-sub{ color:var(--muted); font-size:14.5px; margin:0 0 28px; }

.stat-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:16px; margin-bottom:28px; }
.stat-card{ background:var(--panel); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow); }
.stat-card .lbl{ font-size:12.5px; color:var(--muted); font-weight:600; margin-bottom:8px; }
.stat-card .val{ font-size:24px; font-weight:800; letter-spacing:-0.01em; }

.panel{ background:var(--panel); border-radius:var(--radius); box-shadow:var(--shadow); padding:24px; }
.panel + .panel{ margin-top:20px; }
.panel-head{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
.panel-head h2{ font-size:17px; margin:0; font-weight:700; }
.panel-head p{ font-size:13px; color:var(--muted); margin:4px 0 0; }

.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
  background:#14161A; color:#fff; padding:12px 20px; border-radius:10px; font-size:14px;
  opacity:0; pointer-events:none; transition:opacity 0.25s ease, transform 0.25s ease; z-index:500;
  box-shadow:0 10px 30px rgba(0,0,0,0.25);
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

.modal-overlay{
  position:fixed; inset:0; z-index:400; display:none; align-items:center; justify-content:center;
  background:rgba(15,17,21,0.55); padding:20px; overflow-y:auto;
}
.modal-overlay.show{ display:flex; }
.modal{
  background:#fff; border-radius:18px; width:100%; max-width:520px; padding:28px;
  max-height:88vh; overflow-y:auto; position:relative;
}
.modal h3{ margin:0 0 4px; font-size:19px; }
.modal .sub{ color:var(--muted); font-size:13.5px; margin:0 0 20px; }
.modal-close{
  position:absolute; top:18px; right:18px; width:30px; height:30px; border-radius:50%;
  border:none; background:var(--border); font-size:18px; line-height:1; color:var(--text);
}
.modal-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:22px; }
.field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

/* ---------- CAMPAIGN REPORTS: per-creator editor (admin.js) ---------- */
.report-creators-editor{ margin-top:6px; padding-top:16px; border-top:1px solid var(--border); }
.report-creator-box{
  border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:14px; background:var(--bg-soft, #FAFBFC);
}
.report-creator-head{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.report-creator-head select{ flex:1; }
.report-links-block{ margin-top:12px; }
.report-links-block > label{ display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:8px; }
.report-link-row{ display:flex; gap:8px; margin-bottom:8px; align-items:center; }
.report-link-row select{ flex:0 0 130px; }
.report-link-row input[type="text"]{ flex:1; min-width:0; }
.report-link-row button{ flex:0 0 auto; }
.report-share-link-row{ display:flex; gap:8px; }
.report-share-link-row input{
  flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
  font-size:12.5px; color:var(--muted); background:var(--bg-soft, #FAFBFC);
}

/* ---------- TALENT WIZARD (talent-wizard.js) ---------- */
#talentModal{ max-width:640px; padding:0; }
.tw-wizard{ display:flex; flex-direction:column; max-height:88vh; }
.tw-close{
  position:absolute; top:18px; right:18px; width:30px; height:30px; border-radius:50%;
  border:none; background:var(--border); font-size:18px; line-height:1; color:var(--text); z-index:2;
}
.tw-head{ padding:28px 28px 0; }
.tw-head h3{ margin:0 0 4px; font-size:19px; }
.tw-sub{ color:var(--muted); font-size:13.5px; margin:0 0 18px; }
.tw-progress{ display:flex; gap:4px; padding:0 28px 18px; overflow-x:auto; }
.tw-progress-step{ display:flex; flex-direction:column; align-items:center; gap:6px; flex:1; min-width:64px; }
.tw-progress-dot{
  width:26px; height:26px; border-radius:50%; background:var(--border); color:var(--muted);
  display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700;
  transition:background 0.15s ease, color 0.15s ease;
}
.tw-progress-step.tw-active .tw-progress-dot{ background:var(--accent); color:#fff; }
.tw-progress-step.tw-done .tw-progress-dot{ background:#DCFCE7; color:#166534; }
.tw-progress-label{ font-size:10px; color:var(--muted); text-align:center; line-height:1.25; }
.tw-progress-step.tw-active .tw-progress-label{ color:var(--text); font-weight:600; }
.tw-body{ padding:4px 28px 24px; overflow-y:auto; flex:1; }
.tw-step-intro{ color:var(--muted); font-size:13.5px; margin:0 0 18px; line-height:1.55; }
.tw-nav{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:16px 28px; border-top:1px solid var(--border);
}
.tw-nav-right{ display:flex; gap:10px; }
.tw-btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:11px 18px; border-radius:10px; border:none; font-weight:600; font-size:14px; width:auto;
  transition:transform 0.15s ease, opacity 0.15s ease; cursor:pointer;
}
.tw-btn:active{ transform:scale(0.98); }
.tw-btn:disabled{ opacity:0.55; cursor:not-allowed; }
.tw-btn-primary{ background:var(--accent); color:#fff; }
.tw-btn-primary:hover{ opacity:0.92; }
.tw-btn-ghost{ background:var(--border); color:var(--text); }
.tw-btn-ghost:hover{ background:#dcdfe6; }

.tw-field{ margin-bottom:16px; }
.tw-field label{ display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:6px; }
.tw-field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
.tw-field-row .tw-field{ margin-bottom:0; }
.tw-field input, .tw-field textarea, .tw-field select,
.tw-field-row input, .tw-field-row select,
.tw-custom-input{
  width:100%; padding:11px 13px; border:1.5px solid var(--border); border-radius:10px;
  font-size:14.5px; color:var(--text); background:#fff; outline:none;
  transition:border-color 0.15s ease; box-sizing:border-box;
}
.tw-field input:focus, .tw-field textarea:focus, .tw-field select:focus,
.tw-field-row input:focus, .tw-custom-input:focus{ border-color:var(--accent); }
.tw-invalid{ border-color:#DC2626 !important; }
.tw-hint{ font-size:12px; color:var(--muted); margin:6px 0 0; }
.tw-optional{ font-weight:400; text-transform:none; }
.tw-photo-preview{ width:64px; height:64px; border-radius:10px; object-fit:cover; margin-top:8px; display:block; background:#f1f2f5; }

.tw-chip-grid{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
.tw-chip{
  display:inline-flex; align-items:center; gap:7px; padding:7px 12px; border-radius:100px;
  background:#F1F2F5; font-size:12.5px; font-weight:600; cursor:pointer; user-select:none;
}
.tw-chip input{ margin:0; accent-color:var(--accent); }
.tw-chip-static{
  display:inline-flex; align-items:center; padding:6px 12px; border-radius:100px;
  background:#EEF2FF; color:var(--accent); font-size:12.5px; font-weight:600; margin:0 6px 6px 0;
}
.tw-chip-static.tw-removable{ cursor:pointer; background:#F1F2F5; color:var(--text); }
.tw-readonly-chips{ display:flex; flex-wrap:wrap; }
.tw-group-label{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; color:var(--muted); margin:14px 0 8px; }
.tw-group-label:first-child{ margin-top:0; }

.tw-rows{ display:flex; flex-direction:column; gap:10px; margin-bottom:10px; }
.tw-row{ display:grid; grid-template-columns:1fr 90px auto; gap:8px; align-items:center; }
.tw-row input{
  padding:9px 10px; border:1.5px solid var(--border); border-radius:8px; font-size:13.5px; outline:none;
}
.tw-row-remove{
  width:30px; height:30px; border-radius:8px; border:none; background:#FEE2E2; color:#B91C1C;
  font-size:16px; line-height:1; flex-shrink:0; cursor:pointer;
}
.tw-add-row{
  padding:8px 14px; border-radius:8px; border:1.5px solid var(--accent); background:#fff; color:var(--accent);
  font-size:13px; font-weight:600; cursor:pointer;
}
.tw-add-row:hover{ background:#EEF2FF; }

.tw-why-row{
  display:grid; grid-template-columns:1fr auto; grid-template-rows:auto auto; gap:8px 10px;
  border:1px solid var(--border); border-radius:10px; padding:12px;
}
.tw-why-title{ grid-column:1; grid-row:1; padding:9px 10px; border:1.5px solid var(--border); border-radius:8px; font-size:13.5px; font-weight:600; }
.tw-why-desc{ grid-column:1; grid-row:2; padding:9px 10px; border:1.5px solid var(--border); border-radius:8px; font-size:13px; resize:vertical; font-family:inherit; }
.tw-why-row .tw-row-remove{ grid-column:2; grid-row:1; }

.tw-social-row{ border:1px solid var(--border); border-radius:10px; padding:10px; margin-bottom:0; }
.tw-social-row .tw-field-row{ grid-template-columns:120px 1fr 1fr auto; margin-bottom:0; align-items:center; }
.tw-social-extra:empty{ display:none; }
.tw-post-thumbs{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.tw-post-thumb{ width:56px; height:56px; border-radius:8px; overflow:hidden; display:block; }
.tw-post-thumb img{ width:100%; height:100%; object-fit:cover; display:block; background:#f1f2f5; }
.tw-fetch-btn{
  padding:8px 14px; border-radius:8px; border:1.5px solid var(--accent); background:#fff; color:var(--accent);
  font-size:13px; font-weight:600; margin-top:4px; cursor:pointer;
}
.tw-fetch-btn:hover{ background:#EEF2FF; }
.tw-tt-video{ width:100%; padding:8px 10px; border:1.5px solid var(--border); border-radius:8px; font-size:13px; outline:none; margin-bottom:6px; display:block; box-sizing:border-box; }

.tw-gallery-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:12px; }
.tw-gallery-card{ border:1px solid var(--border); border-radius:10px; padding:8px; position:relative; }
.tw-gallery-thumb{ width:100%; aspect-ratio:1/1; border-radius:8px; overflow:hidden; background:#f1f2f5; margin-bottom:8px; }
.tw-gallery-thumb img, .tw-gallery-thumb video{ width:100%; height:100%; object-fit:cover; display:block; }
.tw-gallery-placeholder{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:11px; }
.tw-gallery-cat{ width:100%; padding:7px 8px; border:1.5px solid var(--border); border-radius:7px; font-size:12px; }
.tw-gallery-card .tw-row-remove{ position:absolute; top:12px; right:12px; width:22px; height:22px; font-size:13px; }

.tw-testi-row{ border:1px solid var(--border); border-radius:10px; padding:12px; position:relative; }
.tw-testi-quote{ width:100%; padding:9px 10px; border:1.5px solid var(--border); border-radius:8px; font-size:13.5px; font-family:inherit; resize:vertical; box-sizing:border-box; margin-bottom:8px; }
.tw-testi-row .tw-field-row{ margin-bottom:0; }
.tw-testi-row .tw-row-remove{ position:absolute; top:10px; right:10px; }

@media (max-width: 640px){
  .tw-field-row{ grid-template-columns:1fr; }
  .tw-social-row .tw-field-row{ grid-template-columns:1fr; }
  .tw-row{ grid-template-columns:1fr; }
  .tw-why-row{ grid-template-columns:1fr; }
  .tw-why-row .tw-row-remove{ grid-column:1; justify-self:end; }
}

.btn-sm{ padding:7px 13px; font-size:12.5px; }

/* ---------- TALENT GRID ---------- */
.talent-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:18px; }
.talent-card{
  position:relative;
  border:1px solid var(--border); border-radius:14px; overflow:hidden;
  transition:transform 0.15s ease, box-shadow 0.15s ease;
}
.talent-card:hover{ transform:translateY(-3px); box-shadow:0 10px 24px rgba(0,0,0,0.08); }
.talent-card img{ width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:#f1f2f5; }
/* Hide/Show toggle (client revision, "Major revisions"): a hidden talent
   keeps their full record — nothing is deleted — but is pulled from the
   public roster/roster overlay. Dimmed thumbnail + a small badge so a
   hidden card still reads clearly at a glance in this grid, without
   being confused for a talent that's about to be deleted. */
.talent-card--hidden img{ opacity:0.45; filter:grayscale(0.4); }
.talent-card-hidden-badge{
  position:absolute; top:10px; left:10px; z-index:1;
  display:inline-flex; align-items:center; gap:6px;
  padding:4px 10px; border-radius:100px;
  font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;
  background:#14161A; color:#fff;
}
.talent-card-hidden-badge::before{ content:''; width:6px; height:6px; border-radius:50%; background:#F59E0B; flex-shrink:0; }
.talent-card-body{ padding:14px 16px 16px; }
.talent-card-name{ font-weight:700; font-size:15px; }
.talent-card-niche{ color:var(--muted); font-size:12.5px; margin-top:2px; }
.platform-row{ display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
.p-pill{ width:26px; height:26px; border-radius:8px; overflow:hidden; display:inline-flex; }
.p-pill svg{ width:100%; height:100%; }
.talent-card-actions{ display:flex; gap:8px; margin-top:12px; }
.talent-card-actions .btn{ flex:1; }

/* ---------- DATA TABLES ---------- */
/* Wraps every .data-table (Managers, Brands, Contact Responses, Admin
   Accounts) so on a narrow screen the table scrolls horizontally at a
   legible column width instead of every column getting crushed down to
   the point emails/messages wrap into an unreadable smush — see the
   mobile override below. */
.table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
.data-table{ width:100%; border-collapse:collapse; font-size:13.5px; }
.data-table th{
  text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:0.04em;
  color:var(--muted); font-weight:700; padding:0 12px 10px; border-bottom:1px solid var(--border);
}
.data-table td{ padding:12px; border-bottom:1px solid var(--border); vertical-align:middle; }
.data-table tr:last-child td{ border-bottom:none; }
.table-avatar{ width:38px; height:38px; border-radius:50%; object-fit:cover; background:#f1f2f5; display:block; }
.table-logo{ width:38px; height:38px; border-radius:8px; object-fit:contain; background:#f1f2f5; display:block; padding:5px; box-sizing:border-box; }
.brand-logo-fallback{
  width:38px; height:38px; border-radius:8px; background:#14161A; color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px;
}
.truncate{ max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); }
.table-actions{ display:flex; gap:8px; white-space:nowrap; }
.clickable-row{ cursor:pointer; }
.clickable-row:hover td{ background:#FAFBFC; }

/* ---------- STATUS / TYPE BADGES (Case Study & Campaign Results, Blog) ---------- */
.status-badge{
  display:inline-flex; align-items:center; padding:3px 10px; border-radius:100px;
  font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;
}
.status-badge--draft{ background:#F1F2F5; color:var(--muted); }
.status-badge--published{ background:#DCFCE7; color:#166534; }
.type-badge{
  display:inline-flex; align-items:center; padding:3px 10px; border-radius:100px;
  font-size:11.5px; font-weight:700; background:#EEF2FF; color:var(--accent);
}

/* ---------- SOCIAL PLATFORM ROWS (talent modal) ---------- */
.social-row{ display:grid; grid-template-columns:140px 1fr 1fr auto; gap:8px; margin-bottom:8px; align-items:center; }
.social-row select, .social-row input{
  padding:9px 10px; border:1.5px solid var(--border); border-radius:8px; font-size:13.5px; outline:none;
}
.social-row select:focus, .social-row input:focus{ border-color:var(--accent); }
.row-remove{
  width:30px; height:30px; border-radius:8px; border:none; background:#FEE2E2; color:#B91C1C;
  font-size:16px; line-height:1;
}
.social-entry{
  border:1px solid var(--border); border-radius:10px; padding:10px; margin-bottom:10px;
}
.social-entry .social-row{ margin-bottom:0; }
.social-extra:empty{ display:none; }
.social-extra .extra-hint{ font-size:12px; color:var(--muted); margin:10px 0 6px; }
.social-extra .tt-video-input{
  width:100%; padding:8px 10px; border:1.5px solid var(--border); border-radius:8px;
  font-size:13px; outline:none; margin-bottom:6px; display:block;
}
.social-extra .tt-video-input:focus{ border-color:var(--accent); }
.fetch-btn{
  padding:8px 14px; border-radius:8px; border:1.5px solid var(--accent); background:#fff; color:var(--accent);
  font-size:13px; font-weight:600; margin-top:4px;
}
.fetch-btn:hover{ background:#EEF2FF; }
.fetch-btn:disabled{ opacity:0.6; }
.post-thumbs{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.post-thumbs:empty{ margin-top:0; }
.post-thumb{ width:64px; height:64px; border-radius:8px; overflow:hidden; display:block; }
.post-thumb img{ width:100%; height:100%; object-fit:cover; display:block; background:#f1f2f5; }
.stats-readout{ display:flex; gap:18px; margin-top:8px; }
.stats-readout .v{ display:block; font-weight:700; font-size:15px; }
.stats-readout .k{ display:block; font-size:11px; color:var(--muted); margin-top:2px; }

/* ---------- GALLERY THUMBNAILS (talent modal) ---------- */
.gallery-thumbs{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:10px; }
.gallery-thumbs:empty{ margin-bottom:0; }
.gallery-thumb{ position:relative; width:72px; height:72px; border-radius:8px; overflow:hidden; }
.gallery-thumb img{ width:100%; height:100%; object-fit:cover; display:block; background:#f1f2f5; }
.thumb-remove{
  position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:50%;
  border:none; background:rgba(0,0,0,0.65); color:#fff; font-size:13px; line-height:1;
}

/* ---------- TAG EDITOR (Categories / Available For, talent modal) ---------- */
.field-hint{ font-weight:400; color:var(--muted); text-transform:none; }
.tag-pills{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:8px; }
.tag-pills:empty{ margin-bottom:0; }
.tag-pill{
  display:inline-flex; align-items:center; gap:6px;
  padding:5px 6px 5px 12px; border-radius:100px; background:#EEF0F4; color:var(--text);
  font-size:12.5px; font-weight:600;
}
.tag-pill-remove{
  width:18px; height:18px; border-radius:50%; border:none; background:rgba(0,0,0,0.08);
  color:var(--text); font-size:12px; line-height:1; flex-shrink:0;
}
.tag-pill-remove:hover{ background:rgba(0,0,0,0.16); }
.tag-input{
  width:100%; padding:9px 10px; border:1.5px solid var(--border); border-radius:8px;
  font-size:13.5px; outline:none;
}
.tag-input:focus{ border-color:var(--accent); }

@media (max-width: 640px){
  .social-row{ grid-template-columns:1fr; }
}

@media (max-width: 900px){
  .sidebar{ width:100%; height:auto; position:relative; flex-direction:row; overflow-x:auto; padding:14px; }
  .sidebar .brand{ display:none; }
  .sidebar nav{ flex-direction:row; }
  /* Used to be `display:none` here, which silently removed the ONLY way to
     sign out on mobile (Sign Out lives in .sidebar-foot, not inside <nav>,
     so it never got swept into the horizontal nav-item strip above). Instead
     of hiding it, fold it into that same horizontal scroll row — drop the
     vertical-stack spacing (border-top/margin-top/padding-top) that only
     made sense when this sat stacked under the nav, and hide the "Signed in
     as" text (redundant on a phone, and the tightest thing to sacrifice for
     space) so just the Sign Out button remains, reachable by scrolling the
     row like every other nav item. */
  .sidebar-foot{
    display:flex; align-items:center; flex-shrink:0;
    border-top:none; padding-top:0; margin-top:0;
  }
  .sidebar-foot .whoami{ display:none; }
  .sidebar-foot .nav-item{ white-space:nowrap; }
  #dashboard.show{ flex-direction:column; }
  .main{ margin-left:0; padding:24px 18px 60px; }

  /* Every .data-table (Managers, Brands, Contact Responses, Admin Accounts)
     was rendering at width:100% with no minimum — on a phone that crushes
     a 6-column table down to ~60px per column, wrapping emails and message
     previews into an unreadable smush instead of just letting you scroll to
     see the rest. Give it a real minimum width and let .table-scroll (the
     wrapper added around every <table class="data-table"> in admin.js)
     handle the horizontal scroll instead. */
  .data-table{ min-width:640px; }
  .data-table td, .data-table th{ padding:10px 10px; }
  .truncate{ max-width:160px; }
}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="brand">BRXDGE Admin</div>
    <p class="sub">Sign in to manage talent, managers, and messages.</p>
    <form id="loginForm">
      <div class="field"><label>Username</label><input type="text" id="loginUsername" autocomplete="username" required></div>
      <div class="field"><label>Password</label><input type="password" id="loginPassword" autocomplete="current-password" required></div>
      <button type="submit" class="btn btn-primary">Sign In</button>
      <p class="login-error" id="loginError"></p>
    </form>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <aside class="sidebar">
    <div class="brand">◆ BRXDGE Admin</div>
    <nav>
      <button class="nav-item active" data-page="talent">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M3 9h18" stroke="currentColor" stroke-width="1.8"/></svg>
        Talent Media Kits
      </button>
      <button class="nav-item" data-page="managers">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="currentColor" stroke-width="1.8"/><circle cx="18" cy="9" r="2.3" stroke="currentColor" stroke-width="1.8"/><path d="M15 20c0-2.5 1.8-4.5 4-5" stroke="currentColor" stroke-width="1.8"/></svg>
        Managers
      </button>
      <button class="nav-item" data-page="brands">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="4" width="7" height="7" rx="1.8" stroke="currentColor" stroke-width="1.8"/><rect x="13.5" y="4" width="7" height="7" rx="1.8" stroke="currentColor" stroke-width="1.8"/><rect x="3.5" y="13" width="7" height="7" rx="1.8" stroke="currentColor" stroke-width="1.8"/><rect x="13.5" y="13" width="7" height="7" rx="1.8" stroke="currentColor" stroke-width="1.8"/></svg>
        Brand Marquee
      </button>
      <button class="nav-item" data-page="campaigns">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 13l6-6 4 4 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 5h5v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Case Study &amp; Campaign Results
      </button>
      <button class="nav-item" data-page="blog">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M5 4h11l3 3v13H5V4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 10h6M9 13.5h6M9 17h3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Blog
      </button>
      <button class="nav-item" data-page="reports">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M7.5 15v-3.5M12 15V8M16.5 15v-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Campaign Reports
      </button>
      <button class="nav-item" data-page="messages">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H8l-4 4V5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        Contact Responses
        <span class="nav-badge" id="messagesBadge" style="display:none;">0</span>
      </button>
      <button class="nav-item" data-page="profile">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7" stroke="currentColor" stroke-width="1.8"/></svg>
        Admin Profile
      </button>
    </nav>
    <div class="sidebar-foot">
      <div class="whoami">Signed in as<br><b id="whoamiName">—</b></div>
      <button class="nav-item" id="signOutBtn">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Sign Out
      </button>
    </div>
  </aside>

  <main class="main">
    <div id="page-talent" class="page"></div>
    <div id="page-managers" class="page" style="display:none;"></div>
    <div id="page-brands" class="page" style="display:none;"></div>
    <div id="page-campaigns" class="page" style="display:none;"></div>
    <div id="page-blog" class="page" style="display:none;"></div>
    <div id="page-reports" class="page" style="display:none;"></div>
    <div id="page-messages" class="page" style="display:none;"></div>
    <div id="page-profile" class="page" style="display:none;"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<!-- Modals (shared across pages) -->
<div class="modal-overlay" id="talentModalOverlay">
  <div class="modal" id="talentModal"></div>
</div>
<div class="modal-overlay" id="managerModalOverlay">
  <div class="modal" id="managerModal"></div>
</div>
<div class="modal-overlay" id="brandModalOverlay">
  <div class="modal" id="brandModal"></div>
</div>
<div class="modal-overlay" id="blogModalOverlay">
  <div class="modal" id="blogModal" style="max-width:680px;"></div>
</div>
<div class="modal-overlay" id="campaignModalOverlay">
  <div class="modal" id="campaignModal" style="max-width:640px;"></div>
</div>
<div class="modal-overlay" id="reportModalOverlay">
  <div class="modal" id="reportModal" style="max-width:680px;"></div>
</div>
<div class="modal-overlay" id="messageModalOverlay">
  <div class="modal" id="messageModal"></div>
</div>

<script src="config.js?v=2"></script>
<!-- Cache-busting added here for the first time (this file previously
     loaded these with no version query string at all — under this site's
     Cache-Control: max-age=1yr, immutable policy for non-HTML assets, that
     meant any browser that had ever loaded the admin dashboard before
     would be permanently stuck on whatever version it first cached,
     with no way to pick up future changes to either file). Bump these
     version numbers whenever admin.js or talent-wizard.js content
     changes, same convention already used for these on index.html/
     talent.html. -->
<script src="talent-wizard.js?v=2"></script>
<script src="admin.js?v=4"></script>
</body>
